services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-gameshop}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-gameshop-development-password}"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gateway
      - kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - kafka

  eureka:
    build: ./Eureka_CDS
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - gateway

  login:
    build: ./Login
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-gameshop}:${MONGO_INITDB_ROOT_PASSWORD:-gameshop-development-password}@mongo:27017/"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-gameshop-development-jwt-secret-change-me}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_CALLBACK_URI: "${GOOGLE_CALLBACK_URI:-http://localhost:8081/api/login/callback}"
      FRONTEND_GOOGLE_SUCCESS_URI: "${FRONTEND_GOOGLE_SUCCESS_URI:-http://localhost:3000/inicio_exitoso_google}"
    depends_on:
      mongo:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gateway

  datos:
    build: ./Datos
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-gameshop}:${MONGO_INITDB_ROOT_PASSWORD:-gameshop-development-password}@mongo:27017/"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-gameshop-development-jwt-secret-change-me}"
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
      RAPIDAPI_HOST: "${RAPIDAPI_HOST:-steam2.p.rapidapi.com}"
    depends_on:
      mongo:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gateway

  gateway:
    build: ./Gateway_CDS
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      eureka:
        condition: service_healthy
      login:
        condition: service_healthy
      datos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - gateway

  consumidor-base:
    build: ./Consumidor_Base
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-gameshop}:${MONGO_INITDB_ROOT_PASSWORD:-gameshop-development-password}@mongo:27017/"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4002/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kafka

  consumidor:
    build: ./Consumidor
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      consumidor-base:
        condition: service_healthy
    networks:
      - kafka

  injector:
    build: ./Injector
    restart: "no"
    environment:
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
      RAPIDAPI_HOST: "${RAPIDAPI_HOST:-steam2.p.rapidapi.com}"
      RAPIDAPI_FIXTURE_PATH: /app/data/rapidapi-steam-games.json
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka

  front-next:
    build:
      context: ./front-next
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081/api}"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081/api}"
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - gateway

volumes:
  mongo-data:

networks:
  gateway:
  kafka:
